<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      padding: 16px;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      font-size: 13px;
      color: #1f2329;
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header h3 {
      font-size: 15px;
      font-weight: 600;
    }
    .mode-tag {
      font-size: 12px;
      color: #8f959e;
      font-weight: 400;
      margin-left: 6px;
    }
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #646a73;
    }
    .stats .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .stats .stat-value {
      font-weight: 600;
      color: #1f2329;
    }
    .status {
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.6;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: #f0f9eb; color: #34a853; }
    .status.error { background: #fef0f0; color: #d93025; }
    .status.loading { background: #f5f8ff; color: #245bdb; }
    .info-panel {
      border: 1px solid #dee0e3;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fafbfc;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      row-gap: 8px;
      column-gap: 10px;
      font-size: 12px;
      line-height: 1.5;
    }
    .info-label {
      color: #8f959e;
      white-space: nowrap;
    }
    .info-value {
      color: #1f2329;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .progress {
      display: none;
      margin-bottom: 12px;
    }
    .progress.show { display: block; }
    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: #eef1f6;
      overflow: hidden;
    }
    .progress-bar {
      width: 0;
      height: 100%;
      background: #3370ff;
      transition: width 0.2s ease;
    }
    .progress-text {
      margin-top: 6px;
      font-size: 11px;
      color: #646a73;
    }
    .is-loading .progress-bar {
      background-image: linear-gradient(90deg, #3370ff, #6aa5ff, #3370ff);
      background-size: 160px 100%;
      animation: loadingStripe 1.2s linear infinite;
    }
    @keyframes loadingStripe {
      from { background-position: 0 0; }
      to { background-position: 160px 0; }
    }
    .btn-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    button {
      padding: 6px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .btn-primary {
      background: #3370ff;
      color: #fff;
    }
    .btn-primary:hover { background: #245bdb; }
    .btn-primary:active { background: #1d49c2; }
    .btn-secondary {
      background: #f5f6f7;
      color: #1f2329;
    }
    .btn-secondary:hover { background: #e8eaed; }
    .btn-zip {
      background: #00a870;
      color: #fff;
      display: none;
    }
    .btn-zip:hover { background: #008f5d; }
    .btn-export {
      min-width: 108px;
    }
    .hint {
      color: #8f959e;
      font-size: 11px;
      margin-top: 10px;
      line-height: 1.5;
    }
    .config-panel {
      border: 1px solid #dee0e3;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fff;
    }
    .config-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .config-label {
      font-size: 12px;
      color: #646a73;
    }
    .config-input {
      width: 100%;
      height: 30px;
      border: 1px solid #dee0e3;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
      outline: none;
    }
    .config-input:focus {
      border-color: #3370ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Design JSON Export <span class="mode-tag" id="mode-label"></span></h3>
  </div>
  <div class="stats" id="stats" style="display:none">
    <div class="stat-item">节点 <span class="stat-value" id="stat-nodes">0</span></div>
    <div class="stat-item">文本 <span class="stat-value" id="stat-texts">0</span></div>
    <div class="stat-item">大小 <span class="stat-value" id="stat-size">0 KB</span></div>
  </div>
  <div class="status show loading" id="status">正在读取导出信息...</div>
  <div class="info-panel" id="info-panel">
    <div class="info-grid">
      <div class="info-label">文档</div>
      <div class="info-value" id="info-doc">-</div>
      <div class="info-label">页面</div>
      <div class="info-value" id="info-page">-</div>
      <div class="info-label">导出内容</div>
      <div class="info-value" id="info-target">-</div>
      <div class="info-label">节点数量</div>
      <div class="info-value" id="info-nodes">-</div>
      <div class="info-label">画布尺寸</div>
      <div class="info-value" id="info-size">-</div>
    </div>
  </div>
  <div class="config-panel" id="config-panel" style="display:none"></div>
  <div class="hint" id="selection-summary" style="display:none"></div>
  <div class="progress" id="progress">
    <div class="progress-track">
      <div class="progress-bar" id="progress-bar" style="width:18%"></div>
    </div>
    <div class="progress-text" id="progress-text">正在打开导出面板...</div>
  </div>
  <div class="btn-row">
    <button class="btn-primary btn-export" id="btn-start-export">开始导出</button>
    <button class="btn-zip" id="btn-download-zip">下载 ZIP</button>
    <button class="btn-secondary" id="btn-close">关闭</button>
  </div>
  <div class="hint" id="hint">导出数据可用于代码生成、设计规范提取等场景</div>
  <script>
    var statusEl = document.getElementById('status');
    var btnStartExport = document.getElementById('btn-start-export');
    var btnDownloadZip = document.getElementById('btn-download-zip');
    var btnClose = document.getElementById('btn-close');
    var statsEl = document.getElementById('stats');
    var hintEl = document.getElementById('hint');
    var selectionSummaryEl = document.getElementById('selection-summary');
    var progressEl = document.getElementById('progress');
    var progressBarEl = document.getElementById('progress-bar');
    var progressTextEl = document.getElementById('progress-text');
    var infoPanelEl = document.getElementById('info-panel');
    var configPanelEl = document.getElementById('config-panel');
    var currentZipPayload = null;
    var currentZipName = 'mastergo_export.zip';
    var streamZipPayload = null;
    var exportStarted = false;
    var defaultPngScale = 1;

    function showStatus(type, text) {
      statusEl.className = 'status show ' + type;
      statusEl.textContent = text;
    }

    function setLoading(isLoading) {
      document.body.className = isLoading ? 'is-loading' : '';
      progressEl.className = isLoading ? 'progress show' : 'progress';
      btnStartExport.disabled = isLoading || exportStarted;
      btnDownloadZip.disabled = isLoading;
    }

    function setReady() {
      exportStarted = false;
      document.body.className = '';
      progressEl.className = 'progress';
      btnStartExport.disabled = false;
      btnDownloadZip.disabled = true;
      btnDownloadZip.style.display = 'none';
      showStatus('loading', '确认信息后点击“开始导出”');
    }

    function formatSize(size) {
      if (!size || size.width == null || size.height == null) return '-';
      return size.width + ' x ' + size.height;
    }

    function showExportInfo(info) {
      if (!info) return;
      document.getElementById('info-doc').textContent = info.documentName || '-';
      document.getElementById('info-page').textContent = info.pageName || '-';
      document.getElementById('info-target').textContent = (info.exportTarget === 'selection' ? '选中图层' : '当前页面') + ' / ' + (info.exportType || 'JSON+PNG Zip');
      document.getElementById('info-nodes').textContent = (info.topLevelCount || 0) + ' 个顶层，约 ' + (info.totalCount || 0) + ' 个总节点';
      document.getElementById('info-size').textContent = formatSize(info.pageSize);
      if (info.exportTarget === 'selection' && !info.topLevelCount) {
        btnStartExport.disabled = true;
        showStatus('error', '当前命令需要先选中要导出的图层');
      } else {
        setReady();
      }
      if (info.exportTarget === 'selection') {
        showSelectionSummary(info.selection);
      } else {
        selectionSummaryEl.style.display = 'none';
      }
      configPanelEl.style.display = 'none';
    }

    function readExportConfig() {
      return {
        pngScale: defaultPngScale,
        topFrameNamePattern: 'h5page'
      };
    }

    function updateProgress(payload) {
      var current = payload.current || 0;
      var total = payload.total || 0;
      var pct = total > 0 ? Math.max(4, Math.min(100, Math.round(current / total * 100))) : 18;
      progressBarEl.style.width = pct + '%';
      progressTextEl.textContent = payload.message || '正在导出...';
      showStatus('loading', payload.message || '正在导出...');
      setLoading(true);
    }

    function showSelectionSummary(summary) {
      if (!summary || !summary.items) return;
      var text = '选区 ' + summary.count + ' 个';
      if (summary.items.length) {
        text += '：' + summary.items.map(function (item) {
          return item.name + ' / ' + item.type + (item.hasChildren ? ' / 子节点 ' + item.childCount : '');
        }).join('，');
      }
      if (summary.warnings && summary.warnings.length) {
        text += '。提示：' + summary.warnings.map(function (item) { return item.message; }).join('；');
      }
      selectionSummaryEl.textContent = text;
      selectionSummaryEl.style.display = 'block';
    }

    function countNodes(nodes) {
      var count = 0, texts = 0;
      function walk(arr) {
        for (var i = 0; i < arr.length; i++) {
          count++;
          if (arr[i].type === 'TEXT') texts++;
          if (arr[i].children) walk(arr[i].children);
        }
      }
      if (nodes) walk(nodes);
      return { nodes: count, texts: texts };
    }

    function utf8Bytes(str) {
      return new TextEncoder().encode(str);
    }

    function base64ToBytes(base64) {
      var binary = atob(base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function assetToBytes(asset) {
      if (asset.bytes && asset.bytes.length != null) {
        return new Uint8Array(asset.bytes);
      }
      if (asset.base64) {
        return base64ToBytes(asset.base64);
      }
      return new Uint8Array(0);
    }

    function crc32(bytes) {
      var table = crc32.table;
      if (!table) {
        table = [];
        for (var n = 0; n < 256; n++) {
          var c = n;
          for (var k = 0; k < 8; k++) {
            c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          }
          table[n] = c >>> 0;
        }
        crc32.table = table;
      }
      var crc = 0xffffffff;
      for (var i = 0; i < bytes.length; i++) {
        crc = table[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function u16(value) {
      return new Uint8Array([value & 255, (value >>> 8) & 255]);
    }

    function u32(value) {
      return new Uint8Array([value & 255, (value >>> 8) & 255, (value >>> 16) & 255, (value >>> 24) & 255]);
    }

    function headerBytes(parts) {
      return new Blob(parts);
    }

    async function normalizeFileBytes(bytes) {
      if (bytes instanceof Blob) {
        return new Uint8Array(await bytes.arrayBuffer());
      }
      return bytes;
    }

    async function makeZip(files) {
      var outputParts = [];
      var centralParts = [];
      var offset = 0;

      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var nameBytes = utf8Bytes(file.name);
        var dataBytes = await normalizeFileBytes(file.bytes);
        var checksum = crc32(dataBytes);

        var localHeader = headerBytes([
          u32(0x04034b50),
          u16(20),
          u16(2048),
          u16(0),
          u16(0),
          u16(0),
          u32(checksum),
          u32(dataBytes.length),
          u32(dataBytes.length),
          u16(nameBytes.length),
          u16(0),
          nameBytes
        ]);
        outputParts.push(localHeader, dataBytes);

        var centralHeader = headerBytes([
          u32(0x02014b50),
          u16(20),
          u16(20),
          u16(2048),
          u16(0),
          u16(0),
          u16(0),
          u32(checksum),
          u32(dataBytes.length),
          u32(dataBytes.length),
          u16(nameBytes.length),
          u16(0),
          u16(0),
          u16(0),
          u16(0),
          u32(0),
          u32(offset),
          nameBytes
        ]);
        centralParts.push(centralHeader);

        offset += 30 + nameBytes.length + dataBytes.length;
      }

      var centralOffset = offset;
      var centralSize = 0;
      for (var j = 0; j < centralParts.length; j++) {
        centralSize += centralParts[j].size;
      }
      var endRecord = headerBytes([
        u32(0x06054b50),
        u16(0),
        u16(0),
        u16(files.length),
        u16(files.length),
        u32(centralSize),
        u32(centralOffset),
        u16(0)
      ]);

      return new Blob(outputParts.concat(centralParts, [endRecord]), { type: 'application/zip' });
    }

    async function buildZipFromPayload(payload) {
      var jsonParts = payload.jsonParts;
      if (!jsonParts && payload.jsonNodeParts) {
        jsonParts = [payload.jsonPrefix || ''].concat(payload.jsonNodeParts, [payload.jsonSuffix || '']);
      }
      var files = [];
      if (payload.jsonFiles && payload.jsonFiles.length) {
        for (var jf = 0; jf < payload.jsonFiles.length; jf++) {
          var jsonFile = payload.jsonFiles[jf];
          var splitJsonParts = [jsonFile.prefix || ''].concat(jsonFile.parts || [], [jsonFile.suffix || '']);
          files.push({
            name: jsonFile.fileName || ('dsl/' + String(jf + 1).padStart(2, '0') + '.json'),
            bytes: new Blob(splitJsonParts, { type: 'application/json' })
          });
        }
      }
      files.push({
        name: payload.jsonFileName || 'design.json',
        bytes: jsonParts ? new Blob(jsonParts, { type: 'application/json' }) : utf8Bytes(payload.json || '{}')
      });
      if (payload.bindingJson) {
        files.push({
          name: payload.bindingFileName || 'binding.json',
          bytes: utf8Bytes(payload.bindingJson)
        });
      }
      var assets = payload.assets || [];
      for (var i = 0; i < assets.length; i++) {
        var bytes = assetToBytes(assets[i]);
        if (!bytes.size && !bytes.length) continue;
        files.push({
          name: assets[i].fileName,
          bytes: bytes
        });
      }
      return await makeZip(files);
    }

    function downloadBytes(bytes, fileName) {
      var url = URL.createObjectURL(bytes);
      var link = document.createElement('a');
      link.href = url;
      link.download = fileName || 'mastergo_export.zip';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    btnDownloadZip.disabled = true;
    window.parent.postMessage({ type: 'uiReady' }, '*');
    window.parent.postMessage({ pluginMessage: { type: 'uiReady' } }, '*');

    window.onmessage = function (event) {
      var message = event.data && event.data.pluginMessage ? event.data.pluginMessage : event.data;
      if (!message) return;

      if (message.type === 'exportInfo') {
        showExportInfo(message.info, message.config);
        return;
      }

      if (message.type === 'progress') {
        updateProgress(message);
        return;
      }

      if (message.type === 'selectionSummary') {
        showSelectionSummary(message.summary);
        return;
      }

      if (message.type === 'error') {
        setLoading(false);
        showStatus('error', message.message || '导出失败');
        return;
      }

      if (message.type === 'zipStreamStart') {
        streamZipPayload = {
          jsonFileName: message.jsonFileName || 'design.json',
          jsonPrefix: '',
          jsonNodeParts: [],
          jsonSuffix: '',
          jsonFiles: [],
          jsonFilesByName: {},
          assets: [],
          bindingJson: null,
          bindingFileName: 'binding.json',
          mode: message.mode || '',
        };
        currentZipPayload = null;
        currentZipName = message.zipName || 'mastergo_export.zip';
        showStatus('loading', '正在流式导出 ZIP，请在下载后的 ZIP 内查看 ' + streamZipPayload.jsonFileName + ' 和 dsl/ 目录。');
        if (message.mode) {
          document.getElementById('mode-label').textContent = '- ' + message.mode;
        }
        return;
      }

      if (message.type === 'zipJsonFilePart') {
        if (!streamZipPayload) return;
        var partFileName = message.fileName || 'design.json';
        var partFile = streamZipPayload.jsonFilesByName[partFileName];
        if (!partFile) {
          partFile = {
            fileName: partFileName,
            prefix: '',
            parts: [],
            suffix: ''
          };
          streamZipPayload.jsonFilesByName[partFileName] = partFile;
          streamZipPayload.jsonFiles.push(partFile);
        }
        partFile.parts.push(message.part || '');
        return;
      }

      if (message.type === 'zipJsonFileMeta') {
        if (!streamZipPayload) return;
        var metaFileName = message.fileName || 'design.json';
        var metaFile = streamZipPayload.jsonFilesByName[metaFileName];
        if (!metaFile) {
          metaFile = {
            fileName: metaFileName,
            prefix: '',
            parts: [],
            suffix: ''
          };
          streamZipPayload.jsonFilesByName[metaFileName] = metaFile;
          streamZipPayload.jsonFiles.push(metaFile);
        }
        metaFile.prefix = message.prefix || '';
        metaFile.suffix = message.suffix || '';
        return;
      }

      if (message.type === 'zipAsset') {
        if (!streamZipPayload) return;
        var asset = message.asset || {};
        asset.bytes = message.bytes;
        streamZipPayload.assets.push(asset);
        return;
      }

      if (message.type === 'zipJsonPart') {
        if (!streamZipPayload) return;
        streamZipPayload.jsonNodeParts.push(message.part || '');
        return;
      }

      if (message.type === 'zipJsonMeta') {
        if (!streamZipPayload) return;
        streamZipPayload.jsonFileName = message.fileName || 'design.json';
        streamZipPayload.jsonPrefix = message.prefix || '';
        streamZipPayload.jsonSuffix = message.suffix || '';
        if (message.stats) {
          document.getElementById('stat-nodes').textContent = message.stats.nodeCount || 0;
          document.getElementById('stat-texts').textContent = message.stats.textCount == null ? '-' : message.stats.textCount;
          document.getElementById('stat-size').textContent = ((message.stats.jsonSize || 0) / 1024).toFixed(1) + ' KB';
          statsEl.style.display = 'flex';
        }
        return;
      }

      if (message.type === 'zipStreamDone') {
        currentZipPayload = streamZipPayload;
        if (currentZipPayload && message.bindingJson) {
          currentZipPayload.bindingJson = message.bindingJson;
          currentZipPayload.bindingFileName = message.bindingFileName || 'binding.json';
        }
        streamZipPayload = null;
        setLoading(false);
        progressBarEl.style.width = '100%';
        progressTextEl.textContent = '导出完成';
        btnDownloadZip.style.display = currentZipPayload ? 'inline-block' : 'none';
        hintEl.textContent = currentZipPayload && currentZipPayload.mode === 'binding'
          ? 'ZIP 包含 binding.json 和 picture/ 目录。'
          : (currentZipPayload && currentZipPayload.bindingJson
            ? 'ZIP 包含 manifest.json + dsl/ 分片 + binding.json + picture/ 目录'
            : 'ZIP 包含 manifest.json、每个顶层图层一个 dsl/ 分片，以及 picture/ 目录。');
        showStatus('success', '导出完成，点击下方按钮下载 ZIP');
        return;
      }

      if (message.type === 'sendData') {
        var json = message.text;
        setLoading(false);
        infoPanelEl.style.display = 'none';
        configPanelEl.style.display = 'none';
        btnStartExport.style.display = 'none';
        progressBarEl.style.width = '100%';
        progressTextEl.textContent = '导出完成';
        currentZipPayload = message.zipPayload || null;
        if (currentZipPayload) {
          currentZipPayload.json = json;
        }
        currentZipName = message.zipName || 'mastergo_export.zip';
        btnDownloadZip.style.display = currentZipPayload ? 'inline-block' : 'none';
        hintEl.textContent = currentZipPayload
          ? 'ZIP 包含 design.json 和 png 目录，JSON 内 assets.png 会对应 PNG 文件路径'
          : '导出数据可用于代码生成、设计规范提取等场景';

        if (message.mode) {
          document.getElementById('mode-label').textContent = '- ' + message.mode;
        }

        if (message.stats) {
          document.getElementById('stat-nodes').textContent = message.stats.nodeCount || 0;
          document.getElementById('stat-texts').textContent = message.stats.textCount == null ? '-' : message.stats.textCount;
          document.getElementById('stat-size').textContent = ((message.stats.jsonSize || json.length) / 1024).toFixed(1) + ' KB';
          statsEl.style.display = 'flex';
        } else {
          // 旧数据兼容。新导出会直接传 stats，避免大 JSON 在 UI 中重复解析占内存。
          try {
          var data = JSON.parse(json);
          var c = countNodes(data.nodes);
          document.getElementById('stat-nodes').textContent = c.nodes;
          document.getElementById('stat-texts').textContent = c.texts;
          document.getElementById('stat-size').textContent = (json.length / 1024).toFixed(1) + ' KB';
          statsEl.style.display = 'flex';
          } catch {}
        }

        showStatus('success', currentZipPayload ? '导出完成，点击下方按钮下载 ZIP' : '导出完成');
      }
    };

    btnStartExport.addEventListener('click', function () {
      if (exportStarted) return;
      var exportConfig = readExportConfig();
      if (!exportConfig) return;
      exportStarted = true;
      currentZipPayload = null;
      streamZipPayload = null;
      btnDownloadZip.style.display = 'none';
      infoPanelEl.style.display = 'none';
      btnStartExport.style.display = 'none';
      showStatus('loading', '正在启动导出...');
      setLoading(true);
      window.parent.postMessage({
        type: 'startExport',
        config: exportConfig
      }, '*');
      window.parent.postMessage({
        pluginMessage: {
          type: 'startExport',
          config: exportConfig
        }
      }, '*');
    });

    btnDownloadZip.addEventListener('click', async function () {
      if (!currentZipPayload) return;
      try {
        btnDownloadZip.disabled = true;
        btnDownloadZip.textContent = '生成中...';
        showStatus('loading', '正在生成 ZIP，请稍候...');
        var zipBlob = await buildZipFromPayload(currentZipPayload);
        downloadBytes(zipBlob, currentZipName);
        showStatus('success', 'ZIP 已生成：' + currentZipName);
        currentZipPayload = null;
        btnDownloadZip.style.display = 'none';
        hintEl.textContent = 'ZIP 已下载。为释放内存，如需再次下载请重新导出。';
      } catch (e) {
        showStatus('error', 'ZIP 生成失败：' + e.message);
      } finally {
        btnDownloadZip.disabled = false;
        btnDownloadZip.textContent = '下载 ZIP';
      }
    });

    btnClose.addEventListener('click', function () {
      window.parent.postMessage({ type: 'closePlugin' }, '*');
    });
  </script>
</body>
</html>
