<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浏览器桥接</title>
    <link rel="stylesheet" href="/src/popup/popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>浏览器桥接</h1>
        <span id="status-dot" class="dot"></span>
      </header>
      <dl class="status-list">
        <div class="row">
          <dt>状态</dt>
          <dd id="status">检查中</dd>
        </div>
      </dl>
      <p id="diagnostics" class="diagnostics">正在读取连接诊断</p>
      <form id="bridge-form">
        <label>
          <span>桥接地址</span>
          <input id="bridge-url" type="text" spellcheck="false" placeholder="ws://127.0.0.1:17321" />
        </label>
        <button type="submit">保存并重连</button>
        <p id="bridge-save-status"></p>
      </form>
      <form id="security-form">
        <label>
          <span>允许列表</span>
          <textarea id="allowlist" rows="3" spellcheck="false"></textarea>
        </label>
        <label>
          <span>拒绝列表</span>
          <textarea id="denylist" rows="3" spellcheck="false"></textarea>
        </label>
        <label class="check-row">
          <input id="block-risk" type="checkbox" />
          <span>高风险点击需要确认</span>
        </label>
        <label class="check-row">
          <input id="screenshot-enabled" type="checkbox" />
          <span>允许截图</span>
        </label>
        <button type="submit">保存配置</button>
        <p id="save-status"></p>
      </form>
      <section class="audit-section">
        <h2>最近操作</h2>
        <ul id="audit-log"></ul>
      </section>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
